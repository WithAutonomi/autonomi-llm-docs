name: Deploy Worker Preview

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-worker-preview
  cancel-in-progress: false

jobs:
  deploy-preview:
    name: Deploy preview Worker
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: worker/package-lock.json

      - name: Install dependencies
        working-directory: worker
        run: npm ci

      - name: Stage exact selected public set
        working-directory: worker
        run: npm run stage:assets -- "$GITHUB_SHA"

      - name: Check worker and complete public set
        working-directory: worker
        run: npm run check

      - name: Deploy preview Worker
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: >-
          npm run deploy:preview --
          --message "Preview source commit $GITHUB_SHA"
